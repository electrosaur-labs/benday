name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run workspace test suite
        run: npm test

      - name: Package Photoshop UXP plugin (.ccx)
        run: npm run package:ps

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG_VERSION=$(node -p "require('./packages/benday-ps/package.json').version")
          CCX_FILE="packages/benday-ps/benday-v${PKG_VERSION}.ccx"
          gh release create "$TAG" "$CCX_FILE" \
            --title "Benday ${TAG}" \
            --notes-file CHANGELOG.md
